# Git index.lock + conflict markers while Codex tries to inspect and change the repo.
apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: codex-git-lock
spec:
  target:
    adapter: codex
    prompt: "Fix src/sum.js so `node --test` passes. Then run git status and git add src/sum.js. Do not force-unlock git. Report if git is locked or conflicted."
    sandbox: workspace-write
    ephemeral: true
    json: true
    bypassApprovals: true
  fixture: broken-sum
  timeout: 45s
  faults:
    - type: git
      action: lock
      at: 4s
      duration: 20s
    - type: git
      action: conflict
      at: 5s
      path: README.md
  assertions:
    - fault_injected:git.lock
    - fault_injected:git.conflict
    - file_contains:README.md:<<<<<<< HEAD
    - no_orphan_process
    - git_lock_absent
