apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: llm-timeout
spec:
  target:
    adapter: generic-cli
    executable: node
    args:
      - --input-type=module
      - -e
      - |
        const url = process.env.OPENAI_BASE_URL + "/chat/completions";
        try {
          const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
          await res.text();
          console.log("unexpected complete");
          process.exit(1);
        } catch {
          console.log("disconnected");
          process.exit(0);
        }
  timeout: 8s
  faults:
    - type: llm
      action: timeout
      at: 0ms
      delay: 150ms
  assertions:
    - exit_zero
    - output_contains:disconnected
    - fault_injected:llm.timeout
