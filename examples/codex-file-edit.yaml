# External editor races Codex while it patches the failing test.
# Finds: lost updates, crash on unexpected file change, leftover processes.
apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: codex-file-edit
spec:
  target:
    adapter: codex
    prompt: "Fix src/sum.js so `node --test` passes. Do not change the tests. Keep working until the tests pass."
    sandbox: workspace-write
    ephemeral: true
    json: true
    bypassApprovals: true
  fixture: broken-sum
  timeout: 60s
  faults:
    - type: file
      action: edit
      at: 6s
      path: src/sum.js
      content: "export function add(a, b) {\n  return 0;\n}\n"
  assertions:
    - fault_injected:file.edit
    - no_orphan_process
    - git_state_consistent
    - no_duplicate_tool_side_effect
