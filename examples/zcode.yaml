# ZCode 默认实验。系统按 inject 各类展开成多条。
# fixture: broken-sum 对应 examples/fixtures/broken-sum（src/sum.js 为有意写错的实现）。
# 运行时复制到 .agentchaos-runs/。自有项目请将 fixture 设为绝对路径。
apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: zcode-default
spec:
  target:
    adapter: zcode             # 目标 Agent；也可替换为 codex/claude/kimi
    prompt: "Fix src/sum.js so `node --test` passes."
    json: true                 # 输出结构化事件，便于按 tool/approval 触发故障
    bypassApprovals: true      # 无人值守实验时自动跳过审批
  fixture: broken-sum          # 自有工程请改为绝对路径
  timeout: 3m                  # 单个 case 的最长运行时间
  inject:
    - llm                      # 默认展开该类别下的全部 profile
    - resource
    - file
    - git
    - network
    - process
