# Kill Codex while it is actually using tools on a failing test, then resume.
# Finds: orphan processes, leftover git locks, missing session id, duplicate tool calls.
apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: codex-kill-resume
spec:
  target:
    adapter: codex
    prompt: "Fix src/sum.js so `node --test` passes. Do not change the tests. Keep working until the tests pass."
    sandbox: workspace-write
    ephemeral: false
    json: true
    bypassApprovals: true
  fixture: broken-sum
  timeout: 90s
  recovery:
    restart: true
    resume: true
  faults:
    - type: process
      action: kill
      at: 12s
  assertions:
    - fault_injected:process.kill
    - no_orphan_process
    - git_lock_absent
    - git_state_consistent
    - no_duplicate_tool_side_effect
    - session_resumable
