apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: llm-duplicate
spec:
  target:
    adapter: generic-cli
    executable: node
    args:
      - --input-type=module
      - -e
      - |
        const url = process.env.OPENAI_BASE_URL + "/chat/completions";
        const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
        const body = await res.text();
        console.log(body);
        const hits = body.split("hello").length - 1;
        process.exit(hits >= 2 ? 0 : 1);
  timeout: 8s
  faults:
    - type: llm
      action: duplicate
      at: 0ms
  assertions:
    - exit_zero
    - type: output_contains
      text: hello
    - fault_injected:llm.duplicate
    - no_duplicate_tool_side_effect
