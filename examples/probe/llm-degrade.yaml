apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: llm-degrade
spec:
  target:
    adapter: generic-cli
    executable: node
    args:
      - --input-type=module
      - -e
      - |
        const url = process.env.OPENAI_BASE_URL + "/chat/completions";
        const started = Date.now();
        const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
        const body = await res.text();
        console.log("status", res.status, "ms", Date.now() - started);
        console.log(body);
        process.exit(res.status === 500 ? 0 : 1);
  timeout: 8s
  faults:
    - type: llm
      scene: api_degradation
      delay: 20ms
      at: 0ms
      duration: 5s
  assertions:
    - exit_zero
    - output_contains:status 500
    - fault_injected:llm.degrade
    - llm_triggered
