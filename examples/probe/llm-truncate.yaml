apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: llm-truncate
spec:
  target:
    adapter: generic-cli
    executable: node
    args:
      - --input-type=module
      - -e
      - |
        const url = process.env.OPENAI_BASE_URL + "/chat/completions";
        try {
          const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
          const body = await res.text();
          console.log(body);
          process.exit(body.includes("partial") || !body.includes("[DONE]") ? 0 : 1);
        } catch (err) {
          console.log("truncated", err && err.code ? err.code : "error");
          process.exit(0);
        }
  timeout: 8s
  faults:
    - type: llm
      action: truncate
      at: 0ms
  assertions:
    - exit_zero
    - fault_injected:llm.truncate
