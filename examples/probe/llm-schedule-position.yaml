apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: llm-schedule-position
spec:
  target:
    adapter: generic-cli
    executable: node
    args:
      - --input-type=module
      - -e
      - |
        const url = process.env.OPENAI_BASE_URL + "/chat/completions";
        const statuses = [];
        for (let i = 0; i < 3; i++) {
          const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
          statuses.push(res.status);
        }
        console.log(statuses.join(","));
        process.exit(statuses[0] === 200 && statuses[1] === 500 && statuses[2] === 200 ? 0 : 1);
  timeout: 8s
  faults:
    - type: llm
      action: 500
      callIndex: 2
      at: 0ms
      duration: 5s
  assertions:
    - exit_zero
    - output_contains:200,500,200
    - fault_injected:llm.500
    - llm_triggered
