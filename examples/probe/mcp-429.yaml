apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: mcp-429
spec:
  target:
    adapter: generic-cli
    executable: node
    args:
      - --input-type=module
      - -e
      - |
        const url = process.env.AGENTCHAOS_MCP_URL;
        const res = await fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/call", params: { name: "x" } }),
        });
        const body = await res.text();
        console.log("status", res.status);
        console.log(body);
        process.exit(res.status === 429 ? 0 : 1);
  timeout: 8s
  faults:
    - type: mcp
      action: 429
      at: 0ms
      duration: 5s
  assertions:
    - exit_zero
    - output_contains:status 429
    - fault_injected:mcp.429
