apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: mcp-upstream-proxy-demo
spec:
  target:
    adapter: generic-cli
    executable: node
    args:
      - "-e"
      - |
        const { spawn } = require('child_process');
        const mcpBin = process.env.AGENTCHAOS_MCP_STDIO_BIN;
        // Launch mcp stdio proxy with upstream tool process
        const child = spawn(process.execPath, [mcpBin, '--upstream', process.execPath, '-e', 'const rl=require("readline").createInterface({input:process.stdin}); rl.on("line",(l)=>{const p=JSON.parse(l); if(p.method==="tools/call") process.stdout.write(JSON.stringify({jsonrpc:"2.0",id:p.id,result:{content:[{type:"text",text:"proxied-tool-success"}]}})+"\\n");});'], { stdio: ['pipe', 'pipe', 'inherit'], env: process.env });
        let count = 0;
        child.stdout.on('data', (d) => {
          for (const line of d.toString().split('\n').filter(Boolean)) {
            const resp = JSON.parse(line);
            if (resp.result?.content?.[0]?.text === 'proxied-tool-success') count++;
          }
          if (count === 2) {
            child.kill('SIGKILL');
            process.exit(0);
          }
        });
        // Send duplicate tool call with same request ID 1001
        child.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 1001, method: 'tools/call', params: { name: 'calc' } }) + '\n');
        setTimeout(() => {
          child.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 1001, method: 'tools/call', params: { name: 'calc' } }) + '\n');
        }, 80);
  timeout: 5s
  assertions:
    - exit_zero
    - mcp_stdio_upstream_consistent
