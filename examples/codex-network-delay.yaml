# Stall HTTPS via CONNECT proxy, then restore so the long task can continue.
# Codex traffic that honors HTTPS_PROXY will pause then resume. If it ignores the proxy, validate marks degraded.
apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: codex-network-delay
spec:
  target:
    adapter: codex
    prompt: "Fix src/sum.js so `node --test` passes. Do not change the tests. Keep working until the tests pass."
    sandbox: workspace-write
    ephemeral: true
    json: true
    bypassApprovals: true
  fixture: broken-sum
  timeout: 90s
  faults:
    - type: network
      action: delay
      at: 3s
      duration: 8s
      delay: 2s
  assertions:
    - fault_injected:network.delay
    - no_orphan_process
    - git_state_consistent
    - no_duplicate_tool_side_effect
