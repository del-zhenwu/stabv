apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: llm-malformed
spec:
  target:
    adapter: generic-cli
    executable: node
    args:
      - --input-type=module
      - -e
      - |
        const url = process.env.OPENAI_BASE_URL + "/chat/completions";
        const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
        const body = await res.text();
        console.log(body);
        process.exit(body.includes("{not-json") ? 0 : 1);
  timeout: 8s
  faults:
    - type: llm
      action: malformed
      at: 0ms
  assertions:
    - exit_zero
    - type: output_contains
      text: "{not-json"
    - fault_injected:llm.malformed
