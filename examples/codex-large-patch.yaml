# Replace the file being patched with a 128KiB blob mid-run.
# Finds: OOM-ish tool payloads, truncated patches, session stall on huge diffs.
apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: codex-large-patch
spec:
  target:
    adapter: codex
    prompt: "Fix src/sum.js so `node --test` passes. Do not change the tests. Keep working until the tests pass."
    sandbox: workspace-write
    ephemeral: true
    json: true
    bypassApprovals: true
  fixture: broken-sum
  timeout: 90s
  faults:
    - type: file
      action: edit
      at: 6s
      path: src/sum.js
      sizeBytes: 131072
  assertions:
    - fault_injected:file.edit
    - no_orphan_process
    - git_state_consistent
    - no_duplicate_tool_side_effect
