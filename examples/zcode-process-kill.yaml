# Kill ZCode while it is starting a real failing-test task.
apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: zcode-process-kill
spec:
  target:
    adapter: zcode
    prompt: "Fix src/sum.js so `node --test` passes. Do not change the tests. Keep working until the tests pass."
    json: true
    bypassApprovals: true
  fixture: broken-sum
  timeout: 20s
  faults:
    - type: process
      action: kill
      at: 800ms
  assertions:
    - fault_injected:process.kill
    - exit_nonzero
    - no_orphan_process
