# Kill Codex during a real edit/test loop. Containment only (no resume).
apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: codex-process-kill
spec:
  target:
    adapter: codex
    prompt: "Fix src/sum.js so `node --test` passes. Do not change the tests. Keep working until the tests pass."
    sandbox: workspace-write
    ephemeral: true
    json: true
    bypassApprovals: true
  fixture: broken-sum
  timeout: 45s
  faults:
    - type: process
      action: kill
      at: 8s
  assertions:
    - fault_injected:process.kill
    - exit_nonzero
    - no_orphan_process
    - git_lock_absent
