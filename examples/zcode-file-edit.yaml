# External edit of the file ZCode is supposed to fix.
apiVersion: agentchaos.dev/v1alpha1
kind: Experiment
metadata:
  name: zcode-file-edit
spec:
  target:
    adapter: zcode
    prompt: "Fix src/sum.js so `node --test` passes. Do not change the tests."
    sandbox: workspace-write
    json: true
    bypassApprovals: true
  fixture: broken-sum
  timeout: 20s
  faults:
    - type: file
      action: edit
      at: 400ms
      path: src/sum.js
      content: "export function add(a, b) {\n  return 0;\n}\n"
  assertions:
    - fault_injected:file.edit
    - file_contains:src/sum.js:return 0
    - no_orphan_process
